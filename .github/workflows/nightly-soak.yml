name: Nightly Soak & Chaos Test Suite

on:
  schedule:
    - cron: '0 2 * * *' # Run nightly at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak-tests:
    name: 5-Node Chaos & 300-Block LWMA Soak Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Nightly Soak Tests
        run: go test -tags "soak testhooks" -v -timeout 30m -count=1 ./node -run "TestSoak"
