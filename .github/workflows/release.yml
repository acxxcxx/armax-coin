name: Armaxcoin Multi-Platform Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate_release:
    name: Validate Version & Commit Ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit_sha: ${{ steps.validate.outputs.commit_sha }}
      clean_version: ${{ steps.validate.outputs.clean_version }}
    steps:
      - name: Check out source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate Release Version Tag
        id: validate
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # 1. Reject empty or pure whitespace
          if [ -z "$(echo "${RELEASE_VERSION}" | tr -d '[:space:]')" ]; then
            echo "Error: Release version tag cannot be empty or whitespace" >&2
            exit 1
          fi

          # 2. Strict SemVer 2.0.0 allowlist with mandatory 'v' prefix [Phase 1, Follow-up Point 4]
          if ! echo "${RELEASE_VERSION}" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?$'; then
            echo "Error: Invalid release version format '${RELEASE_VERSION}'. Must match SemVer 2.0.0 with 'v' prefix and no leading zeros in numeric identifiers." >&2
            exit 1
          fi

          # 3. Verify that the Git tag ref exists in the repository
          if ! git rev-parse -q --verify "refs/tags/${RELEASE_VERSION}" >/dev/null; then
            echo "Error: Git tag '${RELEASE_VERSION}' does not exist in repository references." >&2
            exit 1
          fi

          TAG_COMMIT=$(git rev-list -n 1 "refs/tags/${RELEASE_VERSION}")
          if [ -z "${TAG_COMMIT}" ]; then
            echo "Error: Unable to resolve commit SHA for tag '${RELEASE_VERSION}'" >&2
            exit 1
          fi

          # 4. Ensure release does not already exist to preserve immutable audit trail
          if gh release view "${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Error: A release for tag '${RELEASE_VERSION}' already exists. Overwrites are strictly prohibited." >&2
            exit 1
          fi

          echo "commit_sha=${TAG_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "clean_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Validated Release Version: ${RELEASE_VERSION} at commit ${TAG_COMMIT}"

  verify_tests:
    name: Run Quality Gates & Tests
    needs: [validate_release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out verified commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate_release.outputs.commit_sha }}

      - name: Verify checked out commit matches target tag
        env:
          EXPECTED_SHA: ${{ needs.validate_release.outputs.commit_sha }}
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)
          if [ "${CURRENT_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "Error: Checked out commit ${CURRENT_SHA} does not match expected tag commit ${EXPECTED_SHA}" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.27'
          cache: true

      - name: Go Vet
        run: go vet -tags testhooks ./...

      - name: Install staticcheck & govulncheck (pinned versions) [L4-10-e]
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Run staticcheck
        run: staticcheck -tags testhooks ./...

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Run Test Suite with Race Detector
        run: go test -tags testhooks -v -race -count=1 ./...

      - name: Fuzz untrusted parsers
        run: |
          go test ./core -run='^$' -fuzz=FuzzTransactionParser -fuzztime=20s
          go test ./node -run='^$' -fuzz=FuzzP2PMessageParser -fuzztime=20s

  build:
    name: Build Multi-Architecture Binaries
    needs: [validate_release, verify_tests]
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          # Linux 64-bit x86
          - os: linux
            arch: amd64
            artifact_name: armax-linux-amd64
          # Linux 64-bit ARM (Raspberry Pi 4/5, Armbian, AWS Graviton)
          - os: linux
            arch: arm64
            artifact_name: armax-linux-arm64
          # Windows 64-bit x86
          - os: windows
            arch: amd64
            artifact_name: armax-windows-amd64
          # macOS Apple Silicon (ARM64)
          - os: darwin
            arch: arm64
            artifact_name: armax-darwin-arm64

    steps:
      - name: Check out verified commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate_release.outputs.commit_sha }}

      - name: Verify checked out commit matches target tag
        env:
          EXPECTED_SHA: ${{ needs.validate_release.outputs.commit_sha }}
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)
          if [ "${CURRENT_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "Error: Checked out commit ${CURRENT_SHA} does not match expected tag commit ${EXPECTED_SHA}" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.27'
          cache: true

      - name: Compile Binaries (${{ matrix.os }}/${{ matrix.arch }})
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
          RELEASE_VERSION: ${{ needs.validate_release.outputs.clean_version }}
        run: |
          set -euo pipefail
          mkdir -p release_dist
          cp README.md armax.conf.example LICENSE release_dist/

          EXT=""
          if [ "${{ matrix.os }}" = "windows" ]; then
            EXT=".exe"
          fi

          # Build core node daemon, miner, sender, and wallet with deterministic trimpath
          go build -trimpath -ldflags="-s -w -buildid=" -o release_dist/armcoind$EXT main.go
          go build -trimpath -ldflags="-s -w -buildid=" -o release_dist/armminer$EXT miner/miner.go
          go build -trimpath -ldflags="-s -w -buildid=" -o release_dist/armsend$EXT ./cli/armsend
          go build -trimpath -ldflags="-s -w -buildid=" -o release_dist/armwallet$EXT ./cli/armwallet

          # Build armgui desktop wallet (Win32 GUI on Windows, Web Desktop GUI on Linux/macOS)
          if [ "${{ matrix.os }}" = "windows" ] && [ "${{ matrix.arch }}" = "amd64" ]; then
            cp gui/armgui.exe.manifest release_dist/ 2>/dev/null || true
            cp gui/armax_logo.ico release_dist/ 2>/dev/null || true
            go build -trimpath -ldflags="-s -w -H windowsgui -buildid=" -o release_dist/armgui.exe ./gui
          else
            go build -trimpath -ldflags="-s -w -buildid=" -o release_dist/armgui$EXT ./gui
          fi

          # Verify that required binaries were produced
          test -f "release_dist/armcoind$EXT" || (echo "Error: armcoind$EXT was not built" && exit 1)
          test -f "release_dist/armminer$EXT" || (echo "Error: armminer$EXT was not built" && exit 1)
          test -f "release_dist/armsend$EXT" || (echo "Error: armsend$EXT was not built" && exit 1)
          test -f "release_dist/armwallet$EXT" || (echo "Error: armwallet$EXT was not built" && exit 1)
          test -f "release_dist/armgui$EXT" || (echo "Error: armgui$EXT was not built" && exit 1)

      - name: Sign Windows Executables (Authenticode + RFC 3161 Timestamp)
        if: matrix.os == 'windows'
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          set -euo pipefail
          set +x

          if [ -z "${WINDOWS_PFX_BASE64}" ]; then
            echo "Error: Required secret WINDOWS_PFX_BASE64 is missing or empty. Configure it in the 'release-signing' environment." >&2
            exit 1
          fi
          if [ -z "${WINDOWS_PFX_PASSWORD}" ]; then
            echo "Error: Required secret WINDOWS_PFX_PASSWORD is missing or empty. Configure it in the 'release-signing' environment." >&2
            exit 1
          fi

          echo "::add-mask::${WINDOWS_PFX_BASE64}"
          echo "::add-mask::${WINDOWS_PFX_PASSWORD}"

          sudo apt-get update -qq
          sudo apt-get install -y -qq osslsigncode

          SIGN_DIR="${RUNNER_TEMP}/armax_win_sign"
          mkdir -p "${SIGN_DIR}"
          chmod 700 "${SIGN_DIR}"
          PFX_FILE="${SIGN_DIR}/armax-code-signing.pfx"

          printf '%s' "${WINDOWS_PFX_BASE64}" | base64 --decode > "${PFX_FILE}"
          chmod 600 "${PFX_FILE}"

          for exe in release_dist/*.exe; do
            echo "[+] Signing and timestamping ${exe}..."
            if ! osslsigncode sign \
              -pkcs12 "${PFX_FILE}" \
              -readpass <(printf '%s' "${WINDOWS_PFX_PASSWORD}") \
              -n "Armaxcoin Core" \
              -i "https://github.com/acxxcxx/armax-coin" \
              -h sha256 \
              -ts "https://timestamp.digicert.com" \
              -in "${exe}" \
              -out "${exe}.signed"; then
              echo "[!] Primary timestamp authority failed for ${exe}; retrying with fallback http://timestamp.sectigo.com..."
              rm -f "${exe}.signed"
              osslsigncode sign \
                -pkcs12 "${PFX_FILE}" \
                -readpass <(printf '%s' "${WINDOWS_PFX_PASSWORD}") \
                -n "Armaxcoin Core" \
                -i "https://github.com/acxxcxx/armax-coin" \
                -h sha256 \
                -ts "http://timestamp.sectigo.com" \
                -in "${exe}" \
                -out "${exe}.signed"
            fi
            mv "${exe}.signed" "${exe}"

            echo "[+] Verifying Authenticode signature and timestamp on ${exe}..."
            VERIFY_OUT=$(osslsigncode verify -in "${exe}" 2>&1 || true)
            echo "${VERIFY_OUT}"
            if ! echo "${VERIFY_OUT}" | grep -Eqi "Timestamp|Signing time|Message digest"; then
              echo "Error: Signature/timestamp verification failed for ${exe}" >&2
              exit 1
            fi
          done

      - name: Shred Temporary Authenticode Keys
        if: always() && matrix.os == 'windows'
        run: |
          if [ -d "${RUNNER_TEMP}/armax_win_sign" ]; then
            find "${RUNNER_TEMP}/armax_win_sign" -type f -exec shred -u {} \; 2>/dev/null || rm -rf "${RUNNER_TEMP}/armax_win_sign"
            rm -rf "${RUNNER_TEMP}/armax_win_sign"
          fi

      - name: Package & Checksum Archive (${{ matrix.os }}/${{ matrix.arch }})
        env:
          RELEASE_VERSION: ${{ needs.validate_release.outputs.clean_version }}
        run: |
          set -euo pipefail
          cd release_dist
          sha256sum * > SHA256SUMS
          test -s SHA256SUMS || (echo "Error: SHA256SUMS is empty" && exit 1)

          PKG_NAME="armax-${RELEASE_VERSION}-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip -r ../${PKG_NAME}.zip .
          else
            tar -czvf ../${PKG_NAME}.tar.gz .
          fi
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            *.tar.gz
            *.zip

  release:
    name: Sign Checksums & Publish GitHub Release
    needs: [validate_release, build]
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write
    steps:
      - name: Check out verified commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate_release.outputs.commit_sha }}
          fetch-depth: 0

      - name: Verify checked out commit matches target tag
        env:
          EXPECTED_SHA: ${{ needs.validate_release.outputs.commit_sha }}
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)
          if [ "${CURRENT_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "Error: Checked out commit ${CURRENT_SHA} does not match expected tag commit ${EXPECTED_SHA}" >&2
            exit 1
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artifacts

      - name: Aggregate Master SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p release_assets
          cp -r artifacts/*/*.tar.gz release_assets/ 2>/dev/null || true
          cp -r artifacts/*/*.zip release_assets/ 2>/dev/null || true

          # Fail if no archive artifacts were downloaded
          ARCHIVE_COUNT=$(find release_assets -type f \( -name "*.tar.gz" -o -name "*.zip" \) | wc -l)
          if [ "${ARCHIVE_COUNT}" -eq 0 ]; then
            echo "Error: No release archive artifacts found" >&2
            exit 1
          fi

          cd release_assets
          sha256sum *.tar.gz *.zip > SHA256SUMS
          echo "Generated master SHA256SUMS:"
          cat SHA256SUMS
          test -s SHA256SUMS || (echo "Error: SHA256SUMS is empty" && exit 1)
          cd ..

      - name: Sign Master SHA256SUMS with GPG
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          set +x

          if [ -z "${GPG_PRIVATE_KEY}" ]; then
            echo "Error: Required secret GPG_PRIVATE_KEY is missing or empty. Configure it in the 'release-signing' environment." >&2
            exit 1
          fi
          if [ -z "${GPG_PASSPHRASE}" ]; then
            echo "Error: Required secret GPG_PASSPHRASE is missing or empty. Configure it in the 'release-signing' environment." >&2
            exit 1
          fi

          echo "::add-mask::${GPG_PASSPHRASE}"

          export GNUPGHOME="${RUNNER_TEMP}/armax_gnupg"
          mkdir -p "${GNUPGHOME}"
          chmod 700 "${GNUPGHOME}"

          printf '%s\n' "${GPG_PRIVATE_KEY}" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --armor --detach-sign --output release_assets/SHA256SUMS.asc release_assets/SHA256SUMS 3<<< "${GPG_PASSPHRASE}"

          if [ -f "scripts/certs/ARMAX-PGP-KEY.asc" ]; then
            cp scripts/certs/ARMAX-PGP-KEY.asc release_assets/ARMAX-PGP-KEY.asc
          else
            gpg --batch --armor --export > release_assets/ARMAX-PGP-KEY.asc
          fi

          # Verify detached signature before publishing
          gpg --verify release_assets/SHA256SUMS.asc release_assets/SHA256SUMS
          test -s release_assets/SHA256SUMS.asc || (echo "Error: SHA256SUMS.asc is empty" && exit 1)
          test -s release_assets/ARMAX-PGP-KEY.asc || (echo "Error: ARMAX-PGP-KEY.asc is empty" && exit 1)

      - name: Wipe Temporary GPG Keyring
        if: always()
        run: |
          if [ -d "${RUNNER_TEMP}/armax_gnupg" ]; then
            gpgconf --homedir "${RUNNER_TEMP}/armax_gnupg" --kill gpg-agent 2>/dev/null || true
            find "${RUNNER_TEMP}/armax_gnupg" -type f -exec shred -u {} \; 2>/dev/null || rm -rf "${RUNNER_TEMP}/armax_gnupg"
            rm -rf "${RUNNER_TEMP}/armax_gnupg"
          fi

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.validate_release.outputs.clean_version }}
        run: |
          set -euo pipefail

          # Create release and upload all assets using official GitHub CLI with --verify-tag
          gh release create "${RELEASE_VERSION}" release_assets/* \
            --verify-tag \
            --title "Armaxcoin ${RELEASE_VERSION} (Public Testnet Release)" \
            --prerelease \
            --generate-notes
